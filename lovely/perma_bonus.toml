[manifest]
version = "1.0.0"
dump_lua = true
priority = -1

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "perma_h_dollars = self.ability and self.ability.perma_h_dollars or 0,"
position = "after"
payload = """
abn_perma_asc = self.ability and self.ability.abn_perma_asc or 0,
"""
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "bonus_x_chips = self.ability.perma_x_chips ~= 0 and (self.ability.perma_x_chips + 1) or nil,"
position = "after"
payload = """
abn_perma_asc = self.ability.abn_perma_asc ~= 0 and self.ability.abn_perma_asc or nil,
"""
match_indent = true

[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = '''
if specific_vars and specific_vars.bonus_repetitions then
        localize{type = 'other', key = 'card_extra_repetitions', nodes = desc_nodes, vars = {specific_vars.bonus_repetitions, localize(specific_vars.bonus_repetitions > 1 and 'b_retrigger_plural' or 'b_retrigger_single')}}
    end
'''
position = "after"
payload = '''
if specific_vars and specific_vars.abn_perma_asc then
    localize{ type = "other", key = "abn_perma_asc", nodes = desc_nodes, vars = {specific_vars.abn_perma_asc} }
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = """        -- TARGET: main scoring on played cards"""
position = "before"
payload = """
local abn_perma_asc = card.ability and card.ability.abn_perma_asc or 0
if abn_perma_asc ~= 0 then
    ret.playing_card.asc = (ret.playing_card.asc or 0) + abn_perma_asc
end
"""
match_indent = true