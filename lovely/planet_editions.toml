[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# show level up details
[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/utils.lua"]'''
pattern = "if not instant then delay(1.3) end"
position = "before"
payload = '''
if args.level_up and args.from and args.from.ability and args.from.ability.set == 'Planet' and args.from.edition and not instant then
    ABN.apply_planet_edition(args.from, hand, args.level_up, instant)
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/utils.lua"]'''
pattern = "if not instant and not displayed then"
position = "before"
payload = '''
if instant and args.level_up and args.from and args.from.ability and args.from.ability.set == 'Planet' and args.from.edition then
    for _, hand_key in ipairs(args.hands) do
        ABN.apply_planet_edition(args.from, hand_key, args.level_up, instant)
    end
end
'''
match_indent = true