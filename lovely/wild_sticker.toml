[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

[[patches]]
[patches.pattern]
target = 'card.lua'
match_indent = true
position = 'before'
pattern = '''
return self.base.suit == suit
'''
payload = '''
if self and self.area and self.area.cards then
    ABN.all_jokers(function(j)
        if self == self.area.cards[1] and j.ability.abn_stk_wild then
            return true
        end
    end)
end
'''
