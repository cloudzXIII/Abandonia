[manifest]
version = "0.1.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''local text_table = G.localization.descriptions[target.set][target.key].text_parsed'''
match_indent = true
position = "after"
payload = '''
local blind_edition = G.GAME.abn_blind_edition[type]
if blind_edition then
  loc_name, text_table = ABN.localize_blind_edition(loc_name, text_table, blind_edition)
end
'''

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''blind_desc_nodes[#blind_desc_nodes+1] = {n=G.UIT.R, config={align = "cm", maxw = 2.8}, nodes=SMODS.localize_box(v, {default_col = disabled and G.C.UI.TEXT_INACTIVE or target.text_colour or G.C.WHITE, shadow = not disabled, vars = target.vars, scale = target.scale, font = Spectrallib.get_blind_font(blind_choice)})}'''
match_indent = true
position = "at"
payload = '''
blind_desc_nodes[#blind_desc_nodes+1] = {n=G.UIT.R, config={align = "cm", maxw = 2.8}, nodes=SMODS.localize_box(v, {default_col = disabled and G.C.UI.TEXT_INACTIVE or target.text_colour or G.C.WHITE, shadow = not disabled, vars = v.edi_vars or target.vars, scale = target.scale, font = Spectrallib.get_blind_font(blind_choice)})}
'''

[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/overrides.lua"]'
pattern = '''node_def = {n = G.UIT.R, config = {align = "cm", minh = 0.3, maxw = 4.2}, nodes = SMODS.localize_box(G.GAME.blind.loc_debuff_lines[i], {default_col = G.GAME.blind.loc_debuff_lines.text_colour or G.C.UI.TEXT_LIGHT, scale = 1.125 * (G.GAME.blind.loc_debuff_lines.scale or 1), vars = G.GAME.blind.loc_debuff_lines.vars or {}, font = Spectrallib.get_blind_font(G.GAME.blind)})}'''
position = "at"
match_indent = true
payload = '''
node_def = {n = G.UIT.R, config = {align = "cm", minh = 0.3, maxw = 4.2}, nodes = SMODS.localize_box(G.GAME.blind.loc_debuff_lines[i], {default_col = G.GAME.blind.loc_debuff_lines.text_colour or G.C.UI.TEXT_LIGHT, scale = 1.125 * (G.GAME.blind.loc_debuff_lines.scale or 1), vars = G.GAME.blind.loc_debuff_lines[i].edi_vars or G.GAME.blind.loc_debuff_lines.vars or {}, font = Spectrallib.get_blind_font(G.GAME.blind)})}
'''
